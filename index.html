      body {
        font-family: 'Inter', sans-serif;

      .mc-border {
        box-shadow: 
          inset 2px 2px 0px #3f3f3f,

      .mc-button {
        position: relative;
        background-color: #3c3c3c;

        box-shadow: inset 4px 4px 0px #1d1d1d, inset -4px -4px 0px #5a5a5a;
      }
      .mc-button-green {
        background-color: #388e3c;
        box-shadow: inset -4px -4px 0px #1b5e20, inset 4px 4px 0px #4caf50;
      }
      .mc-card {
        background: #18181b;
        border: 2px solid #27272a;
      }
